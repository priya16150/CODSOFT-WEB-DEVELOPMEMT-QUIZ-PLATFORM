<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Register | QuizNest</title>
    <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --text-primary: #1a2a3a;
            --text-secondary: #445566;
            --card-bg: rgba(255, 255, 255, 0.94);
            --border-color: rgba(255, 255, 255, 0.4);
            --accent: #f97316;
            --accent-dark: #e25c0c;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.9);
        }
        body.dark {
            --text-primary: #eef2ff;
            --text-secondary: #a0afc5;
            --card-bg: rgba(30, 36, 54, 0.94);
            --border-color: rgba(255, 255, 255, 0.15);
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --input-bg: rgba(30, 36, 54, 0.8);
        }
        body {
            font-family: system-ui, 'Segoe UI', 'Poppins', sans-serif;
            color: var(--text-primary);
            transition: color 0.3s ease;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        body:not(.dark) { background: linear-gradient(135deg, #87CEEB 0%, #FFE4B5 40%, #FFDAB9 100%); }
        body:not(.dark) .sun { position: fixed; top: 50px; right: 50px; width: 80px; height: 80px; background: radial-gradient(circle, #FFD700, #FFA500); border-radius: 50%; box-shadow: 0 0 50px rgba(255,165,0,0.8); z-index: 5; pointer-events: none; animation: sunGlow 2s ease-in-out infinite alternate, sunRotate 10s linear infinite; }
        @keyframes sunGlow { 0% { transform: scale(1); box-shadow: 0 0 30px rgba(255,165,0,0.6); } 100% { transform: scale(1.1); box-shadow: 0 0 70px rgba(255,165,0,1); } }
        @keyframes sunRotate { 100% { transform: rotate(360deg); } }
        body:not(.dark) .cloud { position: fixed; background: rgba(255,255,255,0.95); z-index: 5; pointer-events: none; }
        body:not(.dark) .cloud1 { width: 140px; height: 90px; top: 80px; left: -160px; animation: moveCloud1 25s linear infinite; background: white; border-radius: 100px; }
        body:not(.dark) .cloud1::before, body:not(.dark) .cloud1::after { content: ''; position: absolute; background: white; border-radius: 50%; }
        body:not(.dark) .cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        body:not(.dark) .cloud1::after { width: 50px; height: 50px; top: -20px; left: 70px; }
        body:not(.dark) .cloud2 { width: 180px; height: 110px; top: 200px; left: -220px; animation: moveCloud2 35s linear infinite; opacity: 0.8; background: white; border-radius: 100px; }
        body:not(.dark) .cloud2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        body:not(.dark) .cloud2::after { width: 65px; height: 65px; top: -30px; left: 100px; }
        body:not(.dark) .cloud3 { width: 110px; height: 70px; top: 350px; left: -130px; animation: moveCloud3 20s linear infinite; opacity: 0.7; background: white; border-radius: 100px; }
        body:not(.dark) .cloud3::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        body:not(.dark) .cloud3::after { width: 40px; height: 40px; top: -15px; left: 60px; }
        body:not(.dark) .cloud4 { width: 160px; height: 95px; top: 480px; left: -190px; animation: moveCloud4 30s linear infinite; opacity: 0.6; background: white; border-radius: 100px; }
        body:not(.dark) .cloud4::before { width: 70px; height: 70px; top: -35px; left: 25px; }
        body:not(.dark) .cloud4::after { width: 55px; height: 55px; top: -25px; left: 90px; }
        @keyframes moveCloud1 { 100% { left: 100%; } }
        @keyframes moveCloud2 { 100% { left: 110%; } }
        @keyframes moveCloud3 { 100% { left: 100%; } }
        @keyframes moveCloud4 { 100% { left: 105%; } }
        body:not(.dark) .red-bird { position: fixed; font-size: 28px; z-index: 5; pointer-events: none; animation: flyBird 12s linear infinite; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2)); }
        @keyframes flyBird { 0% { left: -60px; top: 150px; } 25% { top: 130px; } 50% { top: 170px; } 75% { top: 140px; } 100% { left: 100%; top: 160px; } }
        body.dark { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3e 50%, #0d0d2b 100%); }
        body.dark .moon { position: fixed; top: 60px; right: 60px; width: 70px; height: 70px; background: radial-gradient(circle, #f5f5dc, #e6e6a3); border-radius: 50%; box-shadow: 0 0 40px rgba(255,255,200,0.6); z-index: 5; pointer-events: none; animation: moonGlow 3s ease-in-out infinite alternate; }
        @keyframes moonGlow { 0% { box-shadow: 0 0 20px rgba(255,255,200,0.4); } 100% { box-shadow: 0 0 60px rgba(255,255,200,0.9); } }
        body.dark .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: hidden; }
        body.dark .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(1); } 100% { opacity: 1; transform: scale(1.3); } }
        body.dark .shooting-star { position: absolute; width: 100px; height: 2px; background: linear-gradient(90deg, white, rgba(255,255,255,0.8), transparent); border-radius: 50%; animation: shootStar 3s linear infinite; filter: drop-shadow(0 0 4px white); }
        @keyframes shootStar { 0% { transform: translateX(0) translateY(0) rotate(35deg); opacity: 0; width: 0px; } 5% { opacity: 1; width: 100px; } 20% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; } 100% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; } }
        body.dark .galaxy { position: fixed; top: 50%; left: 50%; width: 400px; height: 400px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(100,50,150,0.2), rgba(50,20,100,0.05), transparent); border-radius: 50%; pointer-events: none; z-index: 2; animation: galaxySpin 25s linear infinite; }
        @keyframes galaxySpin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .register-container { width: 100%; max-width: 480px; z-index: 20; position: relative; }
        .register-card { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: 2rem; padding: 2rem; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .logo-area { text-align: center; margin-bottom: 1.5rem; }
        .logo { font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--accent), #2A5298); background-clip: text; -webkit-background-clip: text; color: transparent; }
        .tagline { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.3rem; }
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        .input-group input, .input-group select { width: 100%; padding: 12px 16px; border-radius: 1.5rem; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-primary); font-size: 1rem; transition: 0.2s; }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(249,115,22,0.2); }
        .register-btn { width: 100%; background: var(--accent); border: none; padding: 12px; border-radius: 2rem; font-weight: 700; font-size: 1rem; color: white; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
        .register-btn:hover { background: var(--accent-dark); transform: translateY(-2px); }
        .login-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .login-link a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .back-link { text-align: center; margin-top: 1rem; font-size: 0.85rem; }
        .back-link a { color: var(--accent); text-decoration: none; }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }
        .success-msg { color: #10b981; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }
        .theme-toggle { position: fixed; top: 20px; right: 20px; background: var(--card-bg); backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: 50px; padding: 8px 16px; cursor: pointer; font-size: 1.2rem; z-index: 100; color: var(--text-primary); }
        @media (max-width: 520px) { body { padding: 1rem; } .register-card { padding: 1.5rem; } }
        body:not(.dark) .moon, body:not(.dark) .stars-container, body:not(.dark) .galaxy, body:not(.dark) .shooting-star { display: none; }
        body.dark .sun, body.dark .cloud, body.dark .red-bird { display: none; }
        body.dark .shooting-star { display: block; }
        body:not(.dark) .shooting-star { display: none; }
    </style>
</head>
<body>

    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="red-bird">🐦</div>
    <div class="moon"></div>
    <div class="stars-container" id="starsContainer"></div>
    <div class="galaxy"></div>

    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>

    <div class="register-container">
        <div class="register-card">
            <div class="logo-area">
                <div class="logo">📚 QuizNest</div>
                <div class="tagline">Create Account</div>
            </div>
            <form id="registerForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="regEmail" placeholder="your@email.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" placeholder="Create a password" required>
                </div>
                <div class="input-group">
                    <label>I want to:</label>
                    <select id="regRole">
                        <option value="taker">📖 Take Quizzes (Quiz Taker)</option>
                        <option value="creator">✏️ Create Quizzes (Quiz Creator)</option>
                    </select>
                </div>
                <button type="submit" class="register-btn">Register →</button>
                <div id="regError" class="error-msg"></div>
                <div id="regSuccess" class="success-msg"></div>
            </form>
            <div class="login-link">
                Already have an account? <a href="login.html">Login here</a>
            </div>
            <div class="back-link">
                <a href="index.html">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>

           function generateStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                container.appendChild(star);
            }
        }
        function generateShootingStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.top = (Math.random() * 40) + '%';
                star.style.left = (Math.random() * 60 + 40) + '%';
                star.style.animationDelay = (Math.random() * 8) + 's';
                star.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                container.appendChild(star);
            }
        }
        generateStars();
        generateShootingStars();

        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const isDark = document.body.classList.contains("dark");
            themeToggle.textContent = isDark ? "☀️ Light" : "🌙 Dark";
        });


        const registerForm = document.getElementById("registerForm");
        const errorDiv = document.getElementById("regError");
        const successDiv = document.getElementById("regSuccess");

        registerForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const username = document.getElementById("regUsername").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const role = document.getElementById("regRole").value;

            if (!username || !email || !password) {
                errorDiv.innerText = "Please fill all fields";
                successDiv.innerText = "";
                return;
            }

            const users = JSON.parse(localStorage.getItem("quiz_users")) || [];
            if (users.find(u => u.username === username)) {
                errorDiv.innerText = "Username already exists. Please choose another.";
                successDiv.innerText = "";
                return;
            }

            users.push({ username, email, password, role });
            localStorage.setItem("quiz_users", JSON.stringify(users));
            
            successDiv.innerText = "Registration successful! Redirecting to login...";
            errorDiv.innerText = "";
            
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);
        });
    </script>
</body>
</html>
