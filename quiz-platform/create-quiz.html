<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Create Quiz | QuizNest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            min-height: 100vh;
            transition: background 0.3s ease;
            position: relative;
            background: linear-gradient(135deg, #87CEEB 0%, #FFE4B5 40%, #FFDAB9 100%);
        }
        body.dark {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3e 50%, #0d0d2b 100%);
        }

        .sun, .cloud, .red-bird { display: block; }
        .moon, .stars-container, .galaxy, .shooting-star { display: none; }
        body.dark .sun, body.dark .cloud, body.dark .red-bird { display: none; }
        body.dark .moon, body.dark .stars-container, body.dark .galaxy, body.dark .shooting-star { display: block; }

        .sun {
            position: fixed; top: 50px; right: 50px; width: 80px; height: 80px;
            background: radial-gradient(circle, #FFD700, #FFA500); border-radius: 50%;
            box-shadow: 0 0 50px rgba(255,165,0,0.8); z-index: 5; pointer-events: none;
            animation: sunGlow 2s ease-in-out infinite alternate;
        }
        @keyframes sunGlow {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(255,165,0,0.6); }
            100% { transform: scale(1.1); box-shadow: 0 0 70px rgba(255,165,0,1); }
        }
        .cloud {
            position: fixed; background: rgba(255,255,255,0.95); z-index: 5; pointer-events: none;
            border-radius: 100px;
        }
        .cloud1 { width: 140px; height: 90px; top: 80px; left: -160px; animation: moveCloud1 25s linear infinite; }
        .cloud1::before, .cloud1::after { content: ''; position: absolute; background: white; border-radius: 50%; }
        .cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud1::after { width: 50px; height: 50px; top: -20px; left: 70px; }
        .cloud2 { width: 180px; height: 110px; top: 200px; left: -220px; animation: moveCloud2 35s linear infinite; opacity: 0.8; }
        .cloud2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .cloud2::after { width: 65px; height: 65px; top: -30px; left: 100px; }
        .cloud3 { width: 110px; height: 70px; top: 350px; left: -130px; animation: moveCloud3 20s linear infinite; opacity: 0.7; }
        .cloud3::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud3::after { width: 40px; height: 40px; top: -15px; left: 60px; }
        .cloud4 { width: 160px; height: 95px; top: 480px; left: -190px; animation: moveCloud4 30s linear infinite; opacity: 0.6; }
        .cloud4::before { width: 70px; height: 70px; top: -35px; left: 25px; }
        .cloud4::after { width: 55px; height: 55px; top: -25px; left: 90px; }
        @keyframes moveCloud1 { 100% { left: 100%; } }
        @keyframes moveCloud2 { 100% { left: 110%; } }
        @keyframes moveCloud3 { 100% { left: 100%; } }
        @keyframes moveCloud4 { 100% { left: 105%; } }
        .red-bird {
            position: fixed; font-size: 28px; z-index: 5; pointer-events: none;
            animation: flyBird 12s linear infinite;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2));
        }
        @keyframes flyBird {
            0% { left: -60px; top: 150px; }
            25% { top: 130px; } 50% { top: 170px; } 75% { top: 140px; }
            100% { left: 100%; top: 160px; }
        }

        .moon {
            position: fixed; top: 60px; right: 60px; width: 70px; height: 70px;
            background: radial-gradient(circle, #f5f5dc, #e6e6a3); border-radius: 50%;
            box-shadow: 0 0 40px rgba(255,255,200,0.6); z-index: 5; pointer-events: none;
            animation: moonGlow 3s ease-in-out infinite alternate;
        }
        @keyframes moonGlow {
            0% { box-shadow: 0 0 20px rgba(255,255,200,0.4); }
            100% { box-shadow: 0 0 60px rgba(255,255,200,0.9); }
        }
        .stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 3; overflow: hidden;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.3); }
        }
        .shooting-star {
            position: absolute; width: 100px; height: 2px;
            background: linear-gradient(90deg, white, rgba(255,255,255,0.8), transparent);
            border-radius: 50%; animation: shootStar 3s linear infinite;
        }
        @keyframes shootStar {
            0% { transform: translateX(0) translateY(0) rotate(35deg); opacity: 0; width: 0px; }
            5% { opacity: 1; width: 100px; }
            20% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; }
            100% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; }
        }
        .galaxy {
            position: fixed; top: 50%; left: 50%; width: 400px; height: 400px;
            transform: translate(-50%, -50%);
            background: radial-gradient(ellipse, rgba(100,50,150,0.2), rgba(50,20,100,0.05), transparent);
            border-radius: 50%; pointer-events: none; z-index: 2;
            animation: galaxySpin 25s linear infinite;
        }
        @keyframes galaxySpin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }


        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 10;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.1);
        }
        body.dark .card {
            background: rgba(30, 36, 54, 0.95);
            border-color: rgba(255,255,255,0.15);
            color: #f1f5f9;
        }
        h2 {
            color: #1e293b;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        body.dark h2 {
            color: #f1f5f9;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            margin: 8px 0 16px 0;
            border-radius: 1.5rem;
            border: 1px solid #ccc;
            background: white;
            font-size: 1rem;
        }
        body.dark input, body.dark textarea, body.dark select {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        .question-block {
            background: rgba(255,255,255,0.7);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8f0;
        }
        body.dark .question-block {
            background: rgba(30,36,54,0.7);
            border-color: #334155;
        }
        .question-block h4 {
            margin-bottom: 1rem;
            color: #1e293b;
        }
        body.dark .question-block h4 {
            color: #f1f5f9;
        }
        .option-row {
            margin-bottom: 0.8rem;
        }
        .option-row input {
            margin-bottom: 0;
        }
        .correct-select {
            margin-top: 0.5rem;
            width: auto;
            min-width: 150px;
        }
        .remove-btn {
            background: #c44536;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 1.5rem;
            cursor: pointer;
            margin-top: 0.8rem;
            font-size: 0.8rem;
        }
        .btn {
            padding: 10px 20px;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-right: 0.5rem;
        }
        .btn-primary {
            background: #f97316;
            color: white;
        }
        .btn-secondary {
            background: #2c5a4a;
            color: white;
        }
        .btn-small {
            background: #64748b;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 50px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 100;
            color: #1e293b;
            font-weight: 500;
        }
        body.dark .theme-toggle {
            background: rgba(30,36,54,0.9);
            color: #f1f5f9;
            border-color: rgba(255,255,255,0.15);
        }
        .button-group {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .error-msg {
            color: #ef4444;
            margin-top: 0.5rem;
            text-align: center;
        }
        .success-msg {
            color: #10b981;
            margin-top: 0.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="red-bird">🐦</div>
    <div class="moon"></div>
    <div class="stars-container" id="starsContainer"></div>
    <div class="galaxy"></div>

    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>

    <div class="container">
        <div class="card">
            <h2>✏️ Create a New Quiz</h2>
            <form id="createQuizForm">
                <input type="text" id="quizTitle" placeholder="Quiz Title" required>
                <textarea id="quizDesc" placeholder="Description (optional)"></textarea>
                
                <div id="questionsContainer"></div>
                
                <button type="button" id="addQuestionBtn" class="btn btn-secondary">+ Add Question</button>
                
                <div class="button-group">
                    <button type="submit" class="btn btn-primary">💾 Save Quiz</button>
                    <a href="creator-dashboard.html" class="btn btn-small">Cancel</a>
                </div>
                <div id="formMessage" class="error-msg"></div>
            </form>
        </div>
    </div>

    <script>
        function generateStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                container.appendChild(star);
            }
        }
        function generateShootingStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.top = (Math.random() * 40) + '%';
                star.style.left = (Math.random() * 60 + 40) + '%';
                star.style.animationDelay = (Math.random() * 8) + 's';
                star.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                container.appendChild(star);
            }
        }
        generateStars();
        generateShootingStars();

        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const isDark = document.body.classList.contains("dark");
            themeToggle.textContent = isDark ? "☀️ Light" : "🌙 Dark";
        });

        const currentUser = JSON.parse(localStorage.getItem("quiz_current_user"));
        if (!currentUser) {
            window.location.href = "login.html";
        }
        if (currentUser.role !== "creator") {
            alert("Only quiz creators can access this page.");
            window.location.href = "taker-dashboard.html";
        }

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        let questionCount = 0;

        function addQuestionBlock() {
            const container = document.getElementById('questionsContainer');
            const qid = questionCount++;
            const block = document.createElement('div');
            block.className = 'question-block';
            block.setAttribute('data-qid', qid);
            block.innerHTML = `
                <h4>Question ${qid+1}</h4>
                <input type="text" class="q-text" placeholder="Question text" required>
                <div class="option-row"><input type="text" class="opt-0" placeholder="Option 1" required></div>
                <div class="option-row"><input type="text" class="opt-1" placeholder="Option 2" required></div>
                <div class="option-row"><input type="text" class="opt-2" placeholder="Option 3" required></div>
                <div class="option-row"><input type="text" class="opt-3" placeholder="Option 4" required></div>
                <label>Correct answer:</label>
                <select class="correct-select">
                    <option value="0">Option 1</option>
                    <option value="1">Option 2</option>
                    <option value="2">Option 3</option>
                    <option value="3">Option 4</option>
                </select>
                <button type="button" class="remove-btn">Remove question</button>
            `;
            const removeBtn = block.querySelector('.remove-btn');
            removeBtn.addEventListener('click', () => {
                block.remove();

                const blocks = document.querySelectorAll('.question-block');
                blocks.forEach((b, idx) => {
                    b.querySelector('h4').innerText = `Question ${idx+1}`;
                    b.setAttribute('data-qid', idx);
                });
                questionCount = blocks.length;
            });
            container.appendChild(block);
        }

        addQuestionBlock();

        document.getElementById('addQuestionBtn').addEventListener('click', addQuestionBlock);

        document.getElementById('createQuizForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const title = document.getElementById('quizTitle').value.trim();
            if (!title) {
                document.getElementById('formMessage').innerText = "Please enter a quiz title";
                return;
            }
            const description = document.getElementById('quizDesc').value.trim();
            const questionBlocks = document.querySelectorAll('.question-block');
            if (questionBlocks.length === 0) {
                document.getElementById('formMessage').innerText = "Add at least one question";
                return;
            }
            const questions = [];
            for (let i = 0; i < questionBlocks.length; i++) {
                const block = questionBlocks[i];
                const qText = block.querySelector('.q-text').value.trim();
                if (!qText) {
                    document.getElementById('formMessage').innerText = `Question ${i+1} text missing`;
                    return;
                }
                const opts = [];
                for (let j = 0; j < 4; j++) {
                    const optVal = block.querySelector(`.opt-${j}`).value.trim();
                    if (!optVal) {
                        document.getElementById('formMessage').innerText = `Option ${j+1} of question ${i+1} is empty`;
                        return;
                    }
                    opts.push(optVal);
                }
                const correctIdx = parseInt(block.querySelector('.correct-select').value);
                questions.push({
                    text: qText,
                    options: opts,
                    correct: correctIdx
                });
            }
            const newQuiz = {
                id: Date.now().toString(),
                title: title,
                description: description,
                questions: questions,
                createdBy: currentUser.username
            };
            let quizzes = JSON.parse(localStorage.getItem('quiz_quizzes')) || [];
            quizzes.push(newQuiz);
            localStorage.setItem('quiz_quizzes', JSON.stringify(quizzes));
            
            let stats = JSON.parse(localStorage.getItem('quiz_stats')) || { totalQuizzes: 0 };
            stats.totalQuizzes = (stats.totalQuizzes || 0) + 1;
            localStorage.setItem('quiz_stats', JSON.stringify(stats));
            
            
            document.getElementById('formMessage').className = "success-msg";
            document.getElementById('formMessage').innerText = "Quiz saved successfully! Redirecting...";
            setTimeout(() => {
                window.location.href = "creator-dashboard.html";
            }, 1500);
        });
    </script>
</body>
</html>
