<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Take Quiz | QuizNest</title>
    <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            min-height: 100vh;
            transition: background 0.3s ease;
            position: relative;
            background: linear-gradient(135deg, #87CEEB 0%, #FFE4B5 40%, #FFDAB9 100%);
        }
        body.dark {
            background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3e 50%, #0d0d2b 100%);
        }
        .sun, .cloud, .red-bird { display: block; }
        .moon, .stars-container, .galaxy, .shooting-star { display: none; }
        body.dark .sun, body.dark .cloud, body.dark .red-bird { display: none; }
        body.dark .moon, body.dark .stars-container, body.dark .galaxy, body.dark .shooting-star { display: block; }
        .sun { position: fixed; top: 50px; right: 50px; width: 80px; height: 80px; background: radial-gradient(circle, #FFD700, #FFA500); border-radius: 50%; box-shadow: 0 0 50px rgba(255,165,0,0.8); z-index: 5; pointer-events: none; animation: sunGlow 2s ease-in-out infinite alternate; }
        @keyframes sunGlow { 0% { transform: scale(1); box-shadow: 0 0 30px rgba(255,165,0,0.6); } 100% { transform: scale(1.1); box-shadow: 0 0 70px rgba(255,165,0,1); } }
        .cloud { position: fixed; background: rgba(255,255,255,0.95); z-index: 5; pointer-events: none; border-radius: 100px; }
        .cloud1 { width: 140px; height: 90px; top: 80px; left: -160px; animation: moveCloud1 25s linear infinite; }
        .cloud1::before, .cloud1::after { content: ''; position: absolute; background: white; border-radius: 50%; }
        .cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud1::after { width: 50px; height: 50px; top: -20px; left: 70px; }
        .cloud2 { width: 180px; height: 110px; top: 200px; left: -220px; animation: moveCloud2 35s linear infinite; opacity: 0.8; }
        .cloud2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .cloud2::after { width: 65px; height: 65px; top: -30px; left: 100px; }
        .cloud3 { width: 110px; height: 70px; top: 350px; left: -130px; animation: moveCloud3 20s linear infinite; opacity: 0.7; }
        .cloud3::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud3::after { width: 40px; height: 40px; top: -15px; left: 60px; }
        .cloud4 { width: 160px; height: 95px; top: 480px; left: -190px; animation: moveCloud4 30s linear infinite; opacity: 0.6; }
        .cloud4::before { width: 70px; height: 70px; top: -35px; left: 25px; }
        .cloud4::after { width: 55px; height: 55px; top: -25px; left: 90px; }
        @keyframes moveCloud1 { 100% { left: 100%; } }
        @keyframes moveCloud2 { 100% { left: 110%; } }
        @keyframes moveCloud3 { 100% { left: 100%; } }
        @keyframes moveCloud4 { 100% { left: 105%; } }
        .red-bird { position: fixed; font-size: 28px; z-index: 5; pointer-events: none; animation: flyBird 12s linear infinite; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2)); }
        @keyframes flyBird { 0% { left: -60px; top: 150px; } 25% { top: 130px; } 50% { top: 170px; } 75% { top: 140px; } 100% { left: 100%; top: 160px; } }
        .moon { position: fixed; top: 60px; right: 60px; width: 70px; height: 70px; background: radial-gradient(circle, #f5f5dc, #e6e6a3); border-radius: 50%; box-shadow: 0 0 40px rgba(255,255,200,0.6); z-index: 5; pointer-events: none; animation: moonGlow 3s ease-in-out infinite alternate; }
        @keyframes moonGlow { 0% { box-shadow: 0 0 20px rgba(255,255,200,0.4); } 100% { box-shadow: 0 0 60px rgba(255,255,200,0.9); } }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(1); } 100% { opacity: 1; transform: scale(1.3); } }
        .shooting-star { position: absolute; width: 100px; height: 2px; background: linear-gradient(90deg, white, rgba(255,255,255,0.8), transparent); border-radius: 50%; animation: shootStar 3s linear infinite; }
        @keyframes shootStar { 0% { transform: translateX(0) translateY(0) rotate(35deg); opacity: 0; width: 0px; } 5% { opacity: 1; width: 100px; } 20% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; } 100% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; } }
        .galaxy { position: fixed; top: 50%; left: 50%; width: 400px; height: 400px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(100,50,150,0.2), rgba(50,20,100,0.05), transparent); border-radius: 50%; pointer-events: none; z-index: 2; animation: galaxySpin 25s linear infinite; }
        @keyframes galaxySpin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        .container { max-width: 800px; margin: 0 auto; padding: 2rem; position: relative; z-index: 10; }
        .quiz-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 2rem; padding: 2rem; box-shadow: 0 8px 24px rgba(0,0,0,0.1); border: 1px solid rgba(0,0,0,0.1); }
        body.dark .quiz-card { background: rgba(30, 36, 54, 0.95); border-color: rgba(255,255,255,0.15); color: #f1f5f9; }
        h2 { color: #1e293b; margin-bottom: 1rem; }
        body.dark h2 { color: #f1f5f9; }
        .question-text { font-size: 1.3rem; font-weight: 600; margin: 1.5rem 0; color: #1e293b; }
        body.dark .question-text { color: #f1f5f9; }
        .option { display: flex; align-items: center; gap: 12px; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.5); border-radius: 1rem; cursor: pointer; transition: 0.2s; }
        body.dark .option { background: rgba(30,36,54,0.6); }
        .option:hover { background: rgba(249,115,22,0.2); }
        input[type="radio"] { width: 20px; height: 20px; cursor: pointer; }
        .option-label { font-size: 1rem; cursor: pointer; flex: 1; }
        .btn-group { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
        .btn { padding: 10px 24px; border-radius: 2rem; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-primary { background: #f97316; color: white; }
        .btn-secondary { background: #64748b; color: white; }
        .theme-toggle { position: fixed; bottom: 20px; right: 20px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border: 1px solid rgba(0,0,0,0.1); border-radius: 50px; padding: 10px 20px; cursor: pointer; font-size: 1rem; z-index: 100; color: #1e293b; font-weight: 500; }
        body.dark .theme-toggle { background: rgba(30,36,54,0.9); color: #f1f5f9; border-color: rgba(255,255,255,0.15); }
        .results-container { background: rgba(255,255,255,0.95); border-radius: 2rem; padding: 2rem; }
        body.dark .results-container { background: rgba(30,36,54,0.95); }
        .result-item { border-left: 4px solid #f97316; padding: 0.8rem; margin: 1rem 0; background: rgba(255,255,255,0.5); border-radius: 1rem; }
        body.dark .result-item { background: rgba(30,36,54,0.6); }
        .correct { color: #10b981; }
        .wrong { color: #ef4444; }
        .progress { margin-bottom: 1rem; font-weight: 500; }
    </style>
</head>
<body>

    <div class="sun"></div><div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div><div class="cloud cloud4"></div><div class="red-bird">🐦</div>
    <div class="moon"></div><div class="stars-container" id="starsContainer"></div><div class="galaxy"></div>
    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>
    <div class="container" id="appContainer"></div>

    <script>
        function generateStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            for (let i = 0; i < 120; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = (Math.random() * 5) + 's';
                star.style.animationDuration = (Math.random() * 2 + 1) + 's';
                container.appendChild(star);
            }
        }
        function generateShootingStars() {
            const container = document.getElementById('starsContainer');
            if (!container) return;
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.className = 'shooting-star';
                star.style.top = (Math.random() * 40) + '%';
                star.style.left = (Math.random() * 60 + 40) + '%';
                star.style.animationDelay = (Math.random() * 8) + 's';
                star.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                container.appendChild(star);
            }
        }
        generateStars();
        generateShootingStars();

        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            const isDark = document.body.classList.contains("dark");
            themeToggle.textContent = isDark ? "☀️ Light" : "🌙 Dark";
        });

        const currentUser = JSON.parse(localStorage.getItem("quiz_current_user"));
        if (!currentUser) window.location.href = "login.html";

        const quizId = localStorage.getItem("activeQuizId");
        if (!quizId) window.location.href = "taker-dashboard.html";

        let quizzes = JSON.parse(localStorage.getItem("quiz_quizzes")) || [];
        let quizIndex = quizzes.findIndex(q => q.id === quizId);
        if (quizIndex === -1) { alert("Quiz not found"); window.location.href = "taker-dashboard.html"; }
        let quiz = quizzes[quizIndex];

        let userAnswers = new Array(quiz.questions.length).fill(-1);
        let currentIndex = 0;
        let quizFinished = false;

        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function renderQuestion() {
            const q = quiz.questions[currentIndex];
            const selected = userAnswers[currentIndex];
            const html = `
                <div class="quiz-card">
                    <h2>📖 ${escapeHtml(quiz.title)}</h2>
                    <div class="progress">Question ${currentIndex+1} of ${quiz.questions.length}</div>
                    <div class="question-text">${escapeHtml(q.text)}</div>
                    <div id="optionsContainer">
                        ${q.options.map((opt, idx) => `
                            <div class="option" data-opt-index="${idx}">
                                <input type="radio" name="quizOption" value="${idx}" id="opt_${idx}" ${selected === idx ? 'checked' : ''}>
                                <label class="option-label" for="opt_${idx}">${escapeHtml(opt)}</label>
                            </div>
                        `).join('')}
                    </div>
                    <div class="btn-group">
                        <button id="submitBtn" class="btn btn-primary">${currentIndex+1 === quiz.questions.length ? "Finish Quiz" : "Next Question"}</button>
                        <button id="backBtn" class="btn btn-secondary">← Back to Quiz List</button>
                    </div>
                </div>
            `;
            document.getElementById("appContainer").innerHTML = html;
            document.querySelectorAll('.option').forEach(div => {
                div.addEventListener('click', (e) => {
                    const radio = div.querySelector('input[type="radio"]');
                    if (radio) radio.checked = true;
                });
            });
            document.getElementById("submitBtn").addEventListener("click", () => {
                const selectedRadio = document.querySelector('input[name="quizOption"]:checked');
                if (!selectedRadio) { alert("Please select an answer"); return; }
                const answerIdx = parseInt(selectedRadio.value);
                userAnswers[currentIndex] = answerIdx;
                if (currentIndex + 1 < quiz.questions.length) {
                    currentIndex++;
                    renderQuestion();
                } else {
                    finishQuiz();
                }
            });
            document.getElementById("backBtn").addEventListener("click", () => {
                localStorage.removeItem("activeQuizId");
                window.location.href = "taker-dashboard.html";
            });
        }

        function finishQuiz() {

            let score = 0;
            const details = [];
            quiz.questions.forEach((q, idx) => {
                const isCorrect = (userAnswers[idx] === q.correct);
                if (isCorrect) score++;
                details.push({
                    questionText: q.text,
                    userAnswer: userAnswers[idx] !== -1 ? q.options[userAnswers[idx]] : "Not answered",
                    correctAnswer: q.options[q.correct],
                    isCorrect: isCorrect
                });
            });
            const percentage = Math.round((score / quiz.questions.length) * 100);
            let detailsHtml = "";
            details.forEach((det, i) => {
                detailsHtml += `
                    <div class="result-item">
                        <strong>Q${i+1}:</strong> ${escapeHtml(det.questionText)}<br>
                        <span>📌 Your answer: ${escapeHtml(det.userAnswer)}</span><br>
                        <span>✅ Correct answer: ${escapeHtml(det.correctAnswer)}</span><br>
                        <span class="${det.isCorrect ? 'correct' : 'wrong'}">${det.isCorrect ? '✓ Correct' : '✗ Wrong'}</span>
                    </div>
                `;
            });
            const resultsHtml = `
                <div class="results-container">
                    <h2>🏆 Quiz Results: ${escapeHtml(quiz.title)}</h2>
                    <div style="font-size: 1.5rem; margin: 1rem 0;">
                        Score: ${score} / ${quiz.questions.length} (${percentage}%)
                    </div>
                    <hr>
                    ${detailsHtml}
                    <div class="btn-group" style="margin-top: 2rem;">
                        <button id="backToListBtn" class="btn btn-primary">← Back to Quiz List</button>
                    </div>
                </div>
            `;
            document.getElementById("appContainer").innerHTML = resultsHtml;
            document.getElementById("backToListBtn").addEventListener("click", () => {
                localStorage.removeItem("activeQuizId");
                window.location.href = "taker-dashboard.html";
            });


            let quizzes = JSON.parse(localStorage.getItem("quiz_quizzes")) || [];
            const idx = quizzes.findIndex(q => q.id === quiz.id);
            if (idx !== -1) {
                if (!quizzes[idx].timesTaken) quizzes[idx].timesTaken = 0;
                quizzes[idx].timesTaken++;
                localStorage.setItem("quiz_quizzes", JSON.stringify(quizzes));

                let stats = JSON.parse(localStorage.getItem("quiz_stats")) || { totalAttempts: 0 };
                stats.totalAttempts = (stats.totalAttempts || 0) + 1;
                localStorage.setItem("quiz_stats", JSON.stringify(stats));
            }
        }

        renderQuestion();
    </script>
</body>
</html>
