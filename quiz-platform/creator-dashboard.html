<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Quiz Creator | QuizNest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            min-height: 100vh;
            transition: background 0.3s ease;
            position: relative;
            background: linear-gradient(135deg, #87CEEB 0%, #FFE4B5 40%, #FFDAB9 100%);
        }
        body.dark { background: linear-gradient(135deg, #0a0a2a 0%, #1a1a3e 50%, #0d0d2b 100%); }
        .sun, .cloud, .red-bird { display: block; }
        .moon, .stars-container, .galaxy, .shooting-star { display: none; }
        body.dark .sun, body.dark .cloud, body.dark .red-bird { display: none; }
        body.dark .moon, body.dark .stars-container, body.dark .galaxy, body.dark .shooting-star { display: block; }
        .sun { position: fixed; top: 50px; right: 50px; width: 80px; height: 80px; background: radial-gradient(circle, #FFD700, #FFA500); border-radius: 50%; box-shadow: 0 0 50px rgba(255,165,0,0.8); z-index: 5; pointer-events: none; animation: sunGlow 2s ease-in-out infinite alternate; }
        @keyframes sunGlow { 0% { transform: scale(1); box-shadow: 0 0 30px rgba(255,165,0,0.6); } 100% { transform: scale(1.1); box-shadow: 0 0 70px rgba(255,165,0,1); } }
        .cloud { position: fixed; background: rgba(255,255,255,0.95); z-index: 5; pointer-events: none; border-radius: 100px; }
        .cloud1 { width: 140px; height: 90px; top: 80px; left: -160px; animation: moveCloud1 25s linear infinite; }
        .cloud1::before, .cloud1::after { content: ''; position: absolute; background: white; border-radius: 50%; }
        .cloud1::before { width: 60px; height: 60px; top: -30px; left: 20px; }
        .cloud1::after { width: 50px; height: 50px; top: -20px; left: 70px; }
        .cloud2 { width: 180px; height: 110px; top: 200px; left: -220px; animation: moveCloud2 35s linear infinite; opacity: 0.8; }
        .cloud2::before { width: 80px; height: 80px; top: -40px; left: 30px; }
        .cloud2::after { width: 65px; height: 65px; top: -30px; left: 100px; }
        .cloud3 { width: 110px; height: 70px; top: 350px; left: -130px; animation: moveCloud3 20s linear infinite; opacity: 0.7; }
        .cloud3::before { width: 50px; height: 50px; top: -25px; left: 15px; }
        .cloud3::after { width: 40px; height: 40px; top: -15px; left: 60px; }
        .cloud4 { width: 160px; height: 95px; top: 480px; left: -190px; animation: moveCloud4 30s linear infinite; opacity: 0.6; }
        .cloud4::before { width: 70px; height: 70px; top: -35px; left: 25px; }
        .cloud4::after { width: 55px; height: 55px; top: -25px; left: 90px; }
        @keyframes moveCloud1 { 100% { left: 100%; } }
        @keyframes moveCloud2 { 100% { left: 110%; } }
        @keyframes moveCloud3 { 100% { left: 100%; } }
        @keyframes moveCloud4 { 100% { left: 105%; } }
        .red-bird { position: fixed; font-size: 28px; z-index: 5; pointer-events: none; animation: flyBird 12s linear infinite; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.2)); }
        @keyframes flyBird { 0% { left: -60px; top: 150px; } 25% { top: 130px; } 50% { top: 170px; } 75% { top: 140px; } 100% { left: 100%; top: 160px; } }
        .moon { position: fixed; top: 60px; right: 60px; width: 70px; height: 70px; background: radial-gradient(circle, #f5f5dc, #e6e6a3); border-radius: 50%; box-shadow: 0 0 40px rgba(255,255,200,0.6); z-index: 5; pointer-events: none; animation: moonGlow 3s ease-in-out infinite alternate; }
        @keyframes moonGlow { 0% { box-shadow: 0 0 20px rgba(255,255,200,0.4); } 100% { box-shadow: 0 0 60px rgba(255,255,200,0.9); } }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 2s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.3; transform: scale(1); } 100% { opacity: 1; transform: scale(1.3); } }
        .shooting-star { position: absolute; width: 100px; height: 2px; background: linear-gradient(90deg, white, rgba(255,255,255,0.8), transparent); border-radius: 50%; animation: shootStar 3s linear infinite; }
        @keyframes shootStar { 0% { transform: translateX(0) translateY(0) rotate(35deg); opacity: 0; width: 0px; } 5% { opacity: 1; width: 100px; } 20% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; } 100% { transform: translateX(-300px) translateY(200px) rotate(35deg); opacity: 0; width: 0px; } }
        .galaxy { position: fixed; top: 50%; left: 50%; width: 400px; height: 400px; transform: translate(-50%, -50%); background: radial-gradient(ellipse, rgba(100,50,150,0.2), rgba(50,20,100,0.05), transparent); border-radius: 50%; pointer-events: none; z-index: 2; animation: galaxySpin 25s linear infinite; }
        @keyframes galaxySpin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; position: relative; z-index: 10; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 1rem 1.5rem; border-radius: 2rem; border: 1px solid rgba(0,0,0,0.1); }
        body.dark .dashboard-header { background: rgba(30, 36, 54, 0.9); border-color: rgba(255,255,255,0.15); color: #f1f5f9; }
        .dashboard-header h2 { color: #1e293b; }
        body.dark .dashboard-header h2 { color: #f1f5f9; }
        .user-badge { background: #f97316; padding: 6px 14px; border-radius: 2rem; color: white; font-weight: 500; }
        .btn-small { padding: 6px 14px; font-size: 0.85rem; border-radius: 2rem; border: none; cursor: pointer; }
        .btn-danger { background: #c44536; color: white; }
        .creator-actions { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .btn-create { background: #f97316; color: white; padding: 10px 24px; border-radius: 2rem; text-decoration: none; display: inline-block; font-weight: bold; }
        .my-quizzes { margin-top: 2rem; }
        .my-quizzes h3 { color: #1e293b; margin-bottom: 1rem; }
        body.dark .my-quizzes h3 { color: #f1f5f9; }
        .quiz-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
        .quiz-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-radius: 1.5rem; padding: 1.2rem; border: 1px solid rgba(0,0,0,0.1); transition: all 0.3s ease; color: #1e293b; }
        body.dark .quiz-card { background: rgba(30, 36, 54, 0.95); border-color: rgba(255,255,255,0.15); color: #f1f5f9; }
        .quiz-card h3 { margin-bottom: 0.5rem; color: #1e293b; }
        body.dark .quiz-card h3 { color: #f1f5f9; }
        .quiz-card p { color: #334155; font-size: 0.9rem; margin-bottom: 0.5rem; }
        body.dark .quiz-card p { color: #cbd5e1; }
        .delete-btn { background: #c44536; color: white; border: none; padding: 6px 12px; border-radius: 1.5rem; cursor: pointer; margin-top: 0.5rem; font-size: 0.8rem; }
        .empty-state { text-align: center; padding: 3rem; background: rgba(255,255,255,0.9); border-radius: 2rem; color: #334155; }
        body.dark .empty-state { background: rgba(30,36,54,0.9); color: #cbd5e1; }
        .theme-toggle { position: fixed; bottom: 20px; right: 20px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border: 1px solid rgba(0,0,0,0.1); border-radius: 50px; padding: 10px 20px; cursor: pointer; font-size: 1rem; z-index: 100; color: #1e293b; font-weight: 500; }
        body.dark .theme-toggle { background: rgba(30,36,54,0.9); color: #f1f5f9; border-color: rgba(255,255,255,0.15); }
    </style>
</head>
<body>
    <div class="sun"></div><div class="cloud cloud1"></div><div class="cloud cloud2"></div><div class="cloud cloud3"></div><div class="cloud cloud4"></div><div class="red-bird">🐦</div>
    <div class="moon"></div><div class="stars-container" id="starsContainer"></div><div class="galaxy"></div>
    <button class="theme-toggle" id="themeToggle">🌙 Dark</button>

    <div class="container">
        <div class="dashboard-header">
            <h2>✏️ Quiz Creator Dashboard</h2>
            <div><span class="user-badge" id="userNameDisplay"></span><button id="logoutBtn" class="btn-small btn-danger">Logout</button></div>
        </div>
        <div class="creator-actions"><a href="create-quiz.html" class="btn-create">➕ Create New Quiz</a></div>
        <div class="my-quizzes"><h3>📚 My Quizzes</h3><div id="myQuizzesContainer" class="quiz-grid"></div></div>
    </div>

    <script>
        function generateStars() { const c=document.getElementById('starsContainer'); if(!c) return; for(let i=0;i<120;i++){let s=document.createElement('div'); s.className='star'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.width=(Math.random()*3+1)+'px'; s.style.height=s.style.width; s.style.animationDelay=(Math.random()*5)+'s'; c.appendChild(s);} }
        function generateShootingStars() { const c=document.getElementById('starsContainer'); if(!c) return; for(let i=0;i<8;i++){let s=document.createElement('div'); s.className='shooting-star'; s.style.top=(Math.random()*40)+'%'; s.style.left=(Math.random()*60+40)+'%'; s.style.animationDelay=(Math.random()*8)+'s'; c.appendChild(s);} }
        generateStars(); generateShootingStars();
        const themeToggle = document.getElementById("themeToggle");
        themeToggle.addEventListener("click",()=>{ document.body.classList.toggle("dark"); themeToggle.textContent=document.body.classList.contains("dark")?"☀️ Light":"🌙 Dark"; });
        const currentUser = JSON.parse(localStorage.getItem("quiz_current_user"));
        if (!currentUser) window.location.href = "login.html";
        document.getElementById("userNameDisplay").innerHTML = `👤 ${currentUser.username}`;
        document.getElementById("logoutBtn").onclick = () => { localStorage.removeItem("quiz_current_user"); window.location.href = "index.html"; };
        function loadMyQuizzes() {
            const allQuizzes = JSON.parse(localStorage.getItem("quiz_quizzes")) || [];
            const myQuizzes = allQuizzes.filter(q => q.createdBy === currentUser.username);
            const container = document.getElementById("myQuizzesContainer");
            if (myQuizzes.length === 0) { container.innerHTML = `<div class="empty-state">You haven't created any quizzes yet. Click "Create New Quiz" to start.</div>`; return; }
            container.innerHTML = myQuizzes.map(quiz => `
                <div class="quiz-card">
                    <h3>${escapeHtml(quiz.title)}</h3>
                    <p>${escapeHtml(quiz.description || "No description")}</p>
                    <small>${quiz.questions.length} questions · 🧮 Taken ${quiz.timesTaken || 0} times</small>
                    <button class="delete-btn" data-id="${quiz.id}">🗑 Delete</button>
                </div>
            `).join('');
            document.querySelectorAll(".delete-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    const quizId = btn.getAttribute("data-id");
                    if (confirm("Delete this quiz permanently?")) {
                        let updated = allQuizzes.filter(q => q.id !== quizId);
                        localStorage.setItem("quiz_quizzes", JSON.stringify(updated));
                        loadMyQuizzes();
                    }
                });
            });
        }
        function escapeHtml(str) { if (!str) return ""; return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
        loadMyQuizzes();
    </script>
</body>
</html>
